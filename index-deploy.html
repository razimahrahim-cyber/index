<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Pengurusan JKE PPD</title>
<style>
:root {
  --bg: #f4f4f4;
  --surface: #ffffff;
  --sidebar-bg: #161616;
  --sidebar-hover: #262626;
  --sidebar-active-bg: #0f62fe1a;
  --sidebar-active-text: #78a9ff;
  --accent: #0f62fe;
  --accent2: #0043ce;
  --text: #161616;
  --text-muted: #6f6f6f;
  --border: #e0e0e0;
  --success: #24a148;
  --warning: #f1c21b;
  --danger: #da1e28;
  --info: #0072c3;
  --purple: #8a3ffc;
  --teal: #009d9a;
  --header-h: 48px;
  --sidebar-w: 260px;
  --radius: 2px;
  --shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.15);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.5; overflow: hidden;
}
#app { display: flex; height: 100vh; }
.sidebar {
  width: var(--sidebar-w); background: var(--sidebar-bg); color: #c6c6c6;
  display: flex; flex-direction: column; flex-shrink: 0;
  overflow-y: auto; transition: width 0.2s;
}
.main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: var(--header-h); background: var(--surface);
  border-bottom: 1px solid var(--border); display: flex;
  align-items: center; padding: 0 20px; gap: 12px;
  flex-shrink: 0; box-shadow: var(--shadow); z-index: 10;
}
.content { flex: 1; overflow-y: auto; padding: 24px; background: var(--bg); }
.sidebar-logo { padding: 16px; border-bottom: 1px solid #3d3d3d; flex-shrink: 0; }
.logo-emblem {
  width: 36px; height: 36px; background: var(--accent);
  border-radius: var(--radius); display: flex; align-items: center;
  justify-content: center; font-size: 18px; margin-bottom: 8px;
}
.logo-title { font-size: 14px; font-weight: 600; color: #f4f4f4; }
.logo-subtitle { font-size: 11px; color: #a8a8a8; line-height: 1.4; margin-top: 2px; }
.logo-badge {
  display: inline-block; margin-top: 8px;
  background: #24a14822; color: #42be65;
  border: 1px solid #42be6544;
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: 20px; letter-spacing: 0.05em;
}
.sidebar-nav { flex: 1; padding: 8px 0; }
.nav-section { margin-bottom: 4px; }
.nav-section-label {
  font-size: 10px; color: #6f6f6f; text-transform: uppercase;
  letter-spacing: 0.1em; padding: 12px 16px 4px; font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; cursor: pointer; color: #c6c6c6;
  font-size: 13px; border-left: 3px solid transparent;
  transition: background 0.12s, color 0.12s; user-select: none;
}
.nav-item:hover { background: var(--sidebar-hover); color: #f4f4f4; }
.nav-item.active {
  background: var(--sidebar-active-bg);
  color: var(--sidebar-active-text);
  border-left-color: var(--sidebar-active-text);
}
.nav-item-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-item-label { flex: 1; }
.nav-badge { background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 20px; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid #3d3d3d; flex-shrink: 0; }
.user-card { display: flex; align-items: center; gap: 10px; }
.user-avatar-sm {
  width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.user-name { font-size: 12px; color: #f4f4f4; font-weight: 600; }
.user-role { font-size: 11px; color: #a8a8a8; }
.topbar-title { font-size: 15px; font-weight: 600; flex: 1; }
.topbar-date { font-size: 12px; color: var(--text-muted); }
.btn-topbar {
  border: 1px solid var(--border); background: var(--surface);
  padding: 6px 14px; border-radius: var(--radius);
  font-size: 12px; cursor: pointer; color: var(--text); transition: background 0.12s;
}
.btn-topbar:hover { background: var(--bg); }
.btn-topbar.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-topbar.primary:hover { background: var(--accent2); }
.page { display: none; animation: fadeIn 0.2s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.page-header { margin-bottom: 24px; }
.page-title { font-size: 20px; font-weight: 600; color: var(--text); }
.page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--border);
  padding: 20px 20px 16px; border-radius: var(--radius);
  box-shadow: var(--shadow); position: relative; overflow: hidden; cursor: default;
  transition: box-shadow 0.15s, transform 0.15s;
}
.kpi-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.kpi-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi-blue::after  { background: var(--accent); }
.kpi-green::after { background: var(--success); }
.kpi-yellow::after{ background: var(--warning); }
.kpi-red::after   { background: var(--danger); }
.kpi-purple::after{ background: var(--purple); }
.kpi-teal::after  { background: var(--teal); }
.kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
.kpi-value { font-size: 34px; font-weight: 300; line-height: 1.1; }
.kpi-sub  { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
.kpi-trend { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; margin-top: 4px; }
.trend-up   { color: var(--success); }
.trend-down { color: var(--danger); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
.card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 13px; font-weight: 600; }
.card-body { padding: 20px; }
.card-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  background: #f4f4f4; padding: 10px 14px; text-align: left;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-muted);
  border-bottom: 2px solid var(--border); white-space: nowrap; position: sticky; top: 0;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; cursor: pointer; }
tbody tr:hover { background: #f4f4f4; }
tbody td { padding: 10px 14px; font-size: 13px; }
.badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.b-blue   { background: #d0e2ff; color: #0043ce; }
.b-green  { background: #defbe6; color: #0e6027; }
.b-yellow { background: #fcf4d6; color: #6e4f00; }
.b-red    { background: #fff1f1; color: #a2191f; }
.b-purple { background: #e8daff; color: #491d8b; }
.b-teal   { background: #d9fbfb; color: #005d5d; }
.b-gray   { background: #e0e0e0; color: #525252; }
.btn { padding: 8px 16px; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; border: none; font-family: inherit; transition: background 0.12s; }
.btn-primary   { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg); }
.btn-danger    { background: var(--danger); color: #fff; }
.btn-success   { background: var(--success); color: #fff; }
.btn-sm        { padding: 4px 10px; font-size: 11px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text); }
.form-input, .form-select, .form-textarea {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; background: var(--surface); font-family: inherit; color: var(--text);
  transition: border-color 0.1s, box-shadow 0.1s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #0f62fe26; }
.form-textarea { resize: vertical; min-height: 72px; }
.search-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search-input {
  flex: 1; min-width: 200px; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; background: var(--surface); font-family: inherit;
}
.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px #0f62fe26; }
.filter-select {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; background: var(--surface); cursor: pointer; font-family: inherit;
}
.filter-select:focus { outline: none; border-color: var(--accent); }
.pagination { display: flex; align-items: center; gap: 4px; }
.page-btn { padding: 5px 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; border-radius: var(--radius); font-size: 12px; transition: background 0.12s; }
.page-btn:hover:not(:disabled) { background: var(--bg); }
.page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-info { font-size: 12px; color: var(--text-muted); }
.tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.12s; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.progress-track { background: #e0e0e0; border-radius: 20px; height: 8px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 20px; transition: width 0.5s ease; }
.bar-chart { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-label { width: 130px; font-size: 12px; color: var(--text-muted); text-align: right; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; background: #e0e0e0; border-radius: 2px; height: 18px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; display: flex; align-items: center; padding-left: 6px; transition: width 0.6s ease; }
.bar-val { width: 44px; font-size: 12px; font-weight: 600; text-align: right; flex-shrink: 0; }
.donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.donut-legend { display: flex; flex-direction: column; gap: 7px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cal-header-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-bottom: 6px; }
.cal-day-label { text-align: center; font-size: 10px; color: var(--text-muted); font-weight: 600; padding: 4px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-cell { aspect-ratio: 1; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; transition: transform 0.1s, opacity 0.1s; }
.cal-cell:hover { transform: scale(1.1); opacity: 0.85; }
.cal-hadir  { background: var(--accent); color: #fff; }
.cal-cuti   { background: var(--warning); color: #161616; }
.cal-mc     { background: var(--danger); color: #fff; }
.cal-hujung { background: #e0e0e0; color: #a8a8a8; }
.cal-legend { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.cal-leg { display: flex; align-items: center; gap: 5px; font-size: 11px; }
.cal-leg-dot { width: 10px; height: 10px; border-radius: 2px; }
.stat-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-box { flex: 1; min-width: 90px; background: var(--surface); border: 1px solid var(--border); padding: 14px 12px; border-radius: var(--radius); text-align: center; box-shadow: var(--shadow); }
.stat-val { font-size: 26px; font-weight: 300; line-height: 1.1; }
.stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.activity-list { display: flex; flex-direction: column; gap: 12px; }
.activity-item { display: flex; gap: 10px; align-items: flex-start; }
.activity-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.activity-text { font-size: 12px; line-height: 1.4; }
.activity-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.avatar { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; }
.av-32 { width: 32px; height: 32px; font-size: 12px; }
.av-48 { width: 48px; height: 48px; font-size: 16px; }
.av-64 { width: 64px; height: 64px; font-size: 22px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(22,22,22,.6); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; animation: modalIn 0.18s ease; }
.modal-sm { width: 440px; max-width: 95vw; }
.modal-md { width: 580px; max-width: 95vw; }
.modal-lg { width: 720px; max-width: 96vw; }
@keyframes modalIn { from { opacity: 0; transform: scale(.97) translateY(8px); } to { opacity: 1; transform: none; } }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-title { font-size: 15px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); padding: 2px 6px; border-radius: var(--radius); }
.modal-close:hover { background: var(--bg); }
.modal-body { padding: 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--surface); }
.notif-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
.notif-item:hover { background: var(--bg); }
.notif-item.unread { background: #edf5ff; }
.notif-icon-wrap { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.notif-desc { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notif-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.quick-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.text-muted { color: var(--text-muted); }
.text-sm    { font-size: 12px; }
.text-xs    { font-size: 11px; }
.fw-600     { font-weight: 600; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mb-0 { margin-bottom: 0 !important; }
.flex-center { display: flex; align-items: center; gap: 8px; }
.gap-4 { gap: 4px; }
.gap-8 { gap: 8px; }
code.chip { font-size: 11px; background: #f4f4f4; border: 1px solid #e0e0e0; padding: 2px 6px; border-radius: var(--radius); font-family: 'IBM Plex Mono', monospace; }
@media (max-width: 900px) {
  :root { --sidebar-w: 56px; }
  .nav-item-label, .nav-section-label, .logo-subtitle, .logo-badge, .user-name, .user-role { display: none; }
  .logo-title { display: none; }
  .sidebar-logo { padding: 12px; }
  .nav-item { justify-content: center; padding: 12px; }
  .nav-item-icon { width: auto; }
  .sidebar-footer { display: none; }
}
@media (max-width: 640px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .content { padding: 12px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ── data.js ─────────────────────────────────────────────── */
const BAHAGIAN = ['DET','DEP','DTK','DEG','DEQ','Staf Sokongan'];
const JAWATAN_MAP = {
  'DET':           ['Pengarah','Timbalan Pengarah','Penolong Pengarah','Pegawai Tadbir Kanan','Pegawai Tadbir','Pembantu Tadbir'],
  'DEP':           ['Jurutera Elektrik Kanan','Jurutera Elektrik','Jurutera Muda','Juruteknik Elektrik Kanan','Juruteknik Elektrik','Pembantu Teknik'],
  'DTK':           ['Pegawai IT Kanan','Pegawai IT','Pembantu IT','Penganalisis Sistem','Jurutera Perisian'],
  'DEG':           ['Pegawai Kewangan Kanan','Pegawai Kewangan','Pembantu Kewangan','Penolong Akauntan','Kerani Kewangan'],
  'DEQ':           ['Penyelia Operasi','Juruteknik Kanan','Juruteknik','Pembantu Operasi','Penjaga Stor','Pemandu'],
  'Staf Sokongan': ['Pegawai Latihan Kanan','Pegawai Latihan','Fasilitator','Koordinator Latihan','Pembantu Latihan','Pembantu Am']
};
const GRED_MAP = {
  'DET':           ['A44','A41','N29','N17'],
  'DEP':           ['C52','C48','C44','C41'],
  'DTK':           ['F41','F29','F22'],
  'DEG':           ['W48','W44','W22','W17'],
  'DEQ':           ['J41','J29','R11','H11'],
  'Staf Sokongan': ['S41','S29','E41','N17']
};
const NAMA_DEPAN = ['Ahmad','Muhammad','Nor','Siti','Mohd','Nurul','Azman','Faizal','Hairul','Zulkifli','Norazura','Halimah','Roslinda','Syafiqah','Khairul','Norzalina','Ismail','Hazrul','Amirul','Farhana','Rizal','Wan Ahmad','Nik','Aziz','Hafiza','Zalina','Safwan','Hafizuddin','Nurhafiza','Azrul','Rashidah','Muhamad Hafiz','Suzana','Irfan','Nadia','Badrul Hisyam','Rozita','Khairu Anwar','Saidatul','Harith'];
const NAMA_BELAKANG = ['bin Abdullah','binti Hassan','bin Ibrahim','binti Ali','bin Yusof','binti Ahmad','bin Ismail','binti Ramli','bin Othman','binti Razak','bin Hamid','binti Jamil','bin Kassim','binti Zakaria','bin Ghani','binti Nordin','bin Talib','binti Sulaiman','bin Ariffin','binti Kamal','bin Idris','binti Mohd Noor','bin Bakar','binti Hashim','bin Rahim','binti Zainudin','bin Salleh','binti Mansor','bin Harun','binti Osman'];
const AVATAR_COLORS = ['#0f62fe','#24a148','#8a3ffc','#009d9a','#ee5396','#0072c3','#fa4d56','#ff832b'];
const STATUS_OPTIONS = ['Aktif','Aktif','Aktif','Aktif','Aktif','Aktif','Aktif','Cuti','Sakit'];
function sr(seed) { const x = Math.sin(seed + 1) * 10000; return x - Math.floor(x); }
function sri(seed, min, max) { return Math.floor(sr(seed) * (max - min + 1)) + min; }
function genNama(i) { return NAMA_DEPAN[i % NAMA_DEPAN.length] + ' ' + NAMA_BELAKANG[i % NAMA_BELAKANG.length]; }
const STAF = Array.from({ length: 97 }, (_, i) => {
  const bIdx = sri(i*7+1,0,BAHAGIAN.length-1), bahagian = BAHAGIAN[bIdx];
  const jawatan = JAWATAN_MAP[bahagian][sri(i*3+2,0,JAWATAN_MAP[bahagian].length-1)];
  const gred    = GRED_MAP[bahagian][sri(i*5+3,0,GRED_MAP[bahagian].length-1)];
  const status  = STATUS_OPTIONS[sri(i*11+4,0,STATUS_OPTIONS.length-1)];

/* ── charts.js ───────────────────────────────────────────── */
function renderBarChart(containerId,items,max){
  max=max||100; const el=document.getElementById(containerId); if(!el)return;
  el.innerHTML=items.map(item=>{const pct=Math.round((item.value/max)*100),color=item.color||'var(--accent)';
    return`<div class="bar-row"><div class="bar-label" title="${item.label}">${item.label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><div class="bar-val" style="color:${color}">${item.value}${item.unit||''}</div></div>`;
  }).join('');
}
function renderColumnChart(containerId,labels,values,highlightIdx){
  const el=document.getElementById(containerId); if(!el)return;
  const max=Math.max(...values);
  el.innerHTML=`<div style="display:flex;align-items:flex-end;gap:6px;height:140px;padding:0 4px">${labels.map((lbl,i)=>{
    const pct=(values[i]/max)*100, isHl=i===(highlightIdx!==undefined?highlightIdx:labels.length-1);
    return`<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:3px"><div style="font-size:10px;font-weight:${isHl?700:400};color:${isHl?'var(--accent)':'var(--text-muted)'}">${values[i]}%</div><div style="width:100%;background:${isHl?'var(--accent)':'#0f62fe55'};border-radius:2px 2px 0 0;height:${pct*1.1}px;min-height:4px;transition:height .5s"></div><div style="font-size:10px;color:${isHl?'var(--accent)':'var(--text-muted)'};font-weight:${isHl?700:400}">${lbl}</div></div>`;
  }).join('')}</div>`;
}
function renderDonut(svgId,legendId,segments,opts){
  opts=opts||{}; const cx=opts.cx||70,cy=opts.cy||70,R=opts.R||55,r=opts.r||32;
  const total=segments.reduce((s,x)=>s+x.value,0); let angle=-Math.PI/2, paths='';
  segments.forEach(seg=>{
    const sweep=(seg.value/total)*Math.PI*2;
    const x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle),x2=cx+R*Math.cos(angle+sweep),y2=cy+R*Math.sin(angle+sweep);
    const xi1=cx+r*Math.cos(angle+sweep),yi1=cy+r*Math.sin(angle+sweep),xi2=cx+r*Math.cos(angle),yi2=cy+r*Math.sin(angle);
    const large=sweep>Math.PI?1:0;
    paths+=`<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)} L${xi1.toFixed(2)},${yi1.toFixed(2)} A${r},${r} 0 ${large},0 ${xi2.toFixed(2)},${yi2.toFixed(2)} Z" fill="${seg.color}" stroke="#fff" stroke-width="2" title="${seg.label}: ${seg.value}"/>`;
    angle+=sweep;
  });
  const svgEl=document.getElementById(svgId);
  if(svgEl)svgEl.innerHTML=paths+`<text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="16" font-weight="600" fill="#161616">${total}</text><text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="10" fill="#6f6f6f">Staf</text>`;
  const legEl=document.getElementById(legendId);
  if(legEl)legEl.innerHTML=segments.map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div><span>${s.label}: <strong>${s.value}</strong></span></div>`).join('');
}

(function(){
  let lnptFiltered=[...STAF];
  function gredInfo(s){
    if(s>=90)return{label:'Cemerlang',cls:'b-green',color:'var(--success)'};
    if(s>=80)return{label:'Baik',cls:'b-blue',color:'var(--accent)'};
    if(s>=70)return{label:'Memuaskan',cls:'b-yellow',color:'var(--warning)'};
    return{label:'Perlu Peningkatan',cls:'b-red',color:'var(--danger)'};
  }
  function renderLnptTable(data){
    data=data||lnptFiltered; const tbody=document.getElementById('lnpt-tbody'); if(!tbody)return;
    tbody.innerHTML=data.slice(0,35).map((s,i)=>{const g=gredInfo(s.skor_lnpt);return`<tr><td>${i+1}</td><td><div class="flex-center"><div class="avatar av-32" style="background:${s.avatarColor}">${s.nama.split(' ').slice(0,2).map(w=>w[0]).join('')}</div><span class="fw-600">${s.nama}</span></div></td><td><span class="badge b-blue" style="font-size:10px">${s.bahagian}</span></td><td><div class="flex-center"><span class="fw-600" style="color:${g.color}">${s.skor_lnpt}</span><div class="progress-track" style="width:56px"><div class="progress-fill" style="width:${s.skor_lnpt}%;background:${g.color}"></div></div></div></td><td><span class="badge ${g.cls}">${g.label}</span></td><td>${s.kpi}%</td><td><span class="badge b-purple">${s.kompetensi}</span></td><td><button class="btn btn-secondary btn-sm" onclick="StafModule.showDetail(${s.id-1})">📋 Profil</button></td></tr>`;}).join('');
  }
  window.PrestasiModule={
    init(){
      lnptFiltered=[...STAF]; renderLnptTable();
      renderBarChart('kpi-bahagian-chart',BAHAGIAN.map((b,i)=>({label:b,value:sri(i*17+5,78,98),color:sri(i*17+5,78,98)>=90?'var(--success)':'var(--accent)'})),100);
      const tbody=document.getElementById('latihan-tbody'); if(tbody)tbody.innerHTML=LATIHAN_DATA.map((l,i)=>{const cls=l.status==='Selesai'?'b-green':l.status==='Akan Datang'?'b-yellow':'b-blue';return`<tr><td>${i+1}</td><td class="fw-600">${l.prog}</td><td class="text-sm text-muted">${l.tarikh}</td><td style="text-align:center;font-weight:600">${l.peserta}</td><td><span class="badge ${cls}">${l.status}</span></td><td class="text-sm">${l.pemberi}</td></tr>`;}).join('');
      const cem=STAF.filter(s=>s.skor_lnpt>=90).length, baik=STAF.filter(s=>s.skor_lnpt>=80&&s.skor_lnpt<90).length, mem=STAF.filter(s=>s.skor_lnpt>=70&&s.skor_lnpt<80).length, lem=STAF.filter(s=>s.skor_lnpt<70).length;
      renderDonut('prestasi-donut','prestasi-legend',[{label:'Cemerlang (≥90)',value:cem,color:'var(--success)'},{label:'Baik (80–89)',value:baik,color:'var(--accent)'},{label:'Memuaskan (70–79)',value:mem,color:'var(--warning)'},{label:'Perlu Peningkatan (<70)',value:lem,color:'var(--danger)'}]);
    },
    filterLnpt(){const q=(document.getElementById('lnpt-search')?.value||'').toLowerCase();lnptFiltered=q?STAF.filter(s=>s.nama.toLowerCase().includes(q)):[...STAF];renderLnptTable(lnptFiltered);},
    filterByGred(val){if(!val){lnptFiltered=[...STAF];renderLnptTable();return;}const map={cemerlang:s=>s.skor_lnpt>=90,baik:s=>s.skor_lnpt>=80&&s.skor_lnpt<90,memuaskan:s=>s.skor_lnpt>=70&&s.skor_lnpt<80,lemah:s=>s.skor_lnpt<70};lnptFiltered=STAF.filter(map[val]||(()=>true));renderLnptTable(lnptFiltered);}
  };
})();

        <div class="tab-pane" id="prestasi-kpi"><div class="card mb-0"><div class="card-header"><div class="card-title">KPI Semasa Mengikut Bahagian 2025</div></div><div class="card-body"><div id="kpi-bahagian-chart"></div></div></div></div>
        <div class="tab-pane" id="prestasi-latihan"><div class="card mb-0"><div class="card-header"><div class="card-title">Program Latihan & Pembangunan 2025</div></div><div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Program</th><th>Tarikh</th><th>Peserta</th><th>Status</th><th>Pemberi Latihan</th></tr></thead><tbody id="latihan-tbody"></tbody></table></div></div></div>
        <div class="tab-pane" id="prestasi-komposisi"><div class="card mb-0" style="max-width:500px"><div class="card-header"><div class="card-title">Komposisi Gred Prestasi LNPT 2024</div></div><div class="card-body"><div class="donut-wrap"><svg id="prestasi-donut" width="140" height="140" viewBox="0 0 140 140"></svg><div id="prestasi-legend" class="donut-legend"></div></div></div></div></div>
      </div>
      <!-- PAGE 6: LAPORAN -->
      <div class="page" id="page-laporan">
        <div class="page-header"><div class="page-title">Laporan & Statistik</div><div class="page-subtitle">Jana dan muat turun laporan pengurusan jabatan</div></div>
        <div class="grid-3">
          <div class="card"><div class="card-body" style="text-align:center;padding:24px"><div style="font-size:44px;margin-bottom:12px">📋</div><div class="fw-600" style="margin-bottom:6px;font-size:15px">Laporan Kehadiran</div><div class="text-sm text-muted" style="margin-bottom:16px">Rekod kehadiran bulanan semua staf</div><select class="filter-select" style="width:100%;margin-bottom:10px"><option>Jun 2025</option><option>Mei 2025</option><option>Apr 2025</option></select><button class="btn btn-primary" style="width:100%" onclick="LaporanModule.janaPDF('Laporan Kehadiran')">⬇ Jana PDF</button></div></div>
          <div class="card"><div class="card-body" style="text-align:center;padding:24px"><div style="font-size:44px;margin-bottom:12px">🌴</div><div class="fw-600" style="margin-bottom:6px;font-size:15px">Laporan Cuti</div><div class="text-sm text-muted" style="margin-bottom:16px">Ringkasan permohonan dan baki cuti</div><select class="filter-select" style="width:100%;margin-bottom:10px"><option>2025</option><option>2024</option></select><button class="btn btn-primary" style="width:100%" onclick="LaporanModule.janaPDF('Laporan Cuti')">⬇ Jana PDF</button></div></div>
          <div class="card"><div class="card-body" style="text-align:center;padding:24px"><div style="font-size:44px;margin-bottom:12px">⭐</div><div class="fw-600" style="margin-bottom:6px;font-size:15px">Laporan LNPT</div><div class="text-sm text-muted" style="margin-bottom:16px">Ringkasan penilaian prestasi tahunan</div><select class="filter-select" style="width:100%;margin-bottom:10px"><option>2024</option><option>2023</option></select><button class="btn btn-primary" style="width:100%" onclick="LaporanModule.janaPDF('Laporan LNPT')">⬇ Jana PDF</button></div></div>
        </div>
        <div class="grid-2">
          <div class="card"><div class="card-header"><div class="card-title">📊 Bilangan Staf Mengikut Gred</div></div><div class="card-body"><div id="gred-chart"></div></div></div>
          <div class="card"><div class="card-header"><div class="card-title">📈 Trend Kadar Kehadiran Tahunan (%)</div></div><div class="card-body"><div id="annual-chart"></div></div></div>
        </div>
        <div class="card"><div class="card-header"><div class="card-title">🏢 Bilangan Staf Mengikut Bahagian</div></div><div class="card-body"><div id="bahagian-chart"></div></div></div>
        <div class="card mb-0"><div class="card-header"><div class="card-title">📑 Log Laporan Terdahulu</div><button class="btn-topbar">🔄 Muat Semula</button></div><div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Nama Laporan</th><th>Jenis</th><th>Tarikh Jana</th><th>Jana Oleh</th><th>Saiz</th><th>Tindakan</th></tr></thead><tbody id="log-laporan-tbody"></tbody></table></div></div>
      </div>
    </main>
  </div>
  <!-- MODAL: Profil Staf -->
  <div class="modal-overlay" id="modal-staf"><div class="modal modal-md"><div class="modal-header"><div class="modal-title">Profil Staf</div><button class="modal-close" onclick="App.closeModal('modal-staf')">✕</button></div><div class="modal-body" id="modal-staf-body"></div><div class="modal-footer"><button class="btn btn-primary">✏️ Kemaskini</button><button class="btn btn-secondary" onclick="App.closeModal('modal-staf')">Tutup</button></div></div></div>
  <!-- MODAL: Tambah Staf -->
  <div class="modal-overlay" id="modal-tambah-staf"><div class="modal modal-lg"><div class="modal-header"><div class="modal-title">➕ Tambah Staf Baru</div><button class="modal-close" onclick="App.closeModal('modal-tambah-staf')">✕</button></div><div class="modal-body"><div class="form-grid"><div class="form-group"><label class="form-label">Nama Penuh *</label><input class="form-input" placeholder="Nama penuh staf"></div><div class="form-group"><label class="form-label">No. Kad Pengenalan *</label><input class="form-input" placeholder="000000-00-0000"></div><div class="form-group"><label class="form-label">Jawatan *</label><input class="form-input" placeholder="Contoh: Jurutera Elektrik"></div><div class="form-group"><label class="form-label">Bahagian *</label><select class="form-select"><option>DET</option><option>DEP</option><option>DTK</option><option>DEG</option><option>DEQ</option><option>Staf Sokongan</option></select></div><div class="form-group"><label class="form-label">Gred *</label><select class="form-select"><option>A44</option><option>A41</option><option>C52</option><option>C48</option><option>C44</option><option>F41</option><option>W44</option><option>J41</option></select></div><div class="form-group"><label class="form-label">No. Telefon</label><input class="form-input" placeholder="011-00000000"></div><div class="form-group"><label class="form-label">E-mel Rasmi *</label><input class="form-input" placeholder="nama@jkeppd.gov.my"></div><div class="form-group"><label class="form-label">Tarikh Lantikan</label><input type="date" class="form-input"></div></div></div><div class="modal-footer"><button class="btn btn-primary" onclick="alert('✅ Rekod staf baru telah disimpan.');App.closeModal('modal-tambah-staf')">💾 Simpan</button><button class="btn btn-secondary" onclick="App.closeModal('modal-tambah-staf')">Batal</button></div></div></div>
  <!-- MODAL: Notifikasi -->
  <div class="modal-overlay" id="modal-notif"><div class="modal modal-sm"><div class="modal-header"><div class="modal-title">🔔 Notifikasi</div><button class="modal-close" onclick="App.closeModal('modal-notif')">✕</button></div><div id="notif-list" style="max-height:420px;overflow-y:auto"></div></div></div>`;

  const PAGE_TITLES={overview:'Overview KPI',staf:'Direktori Staf',kehadiran:'Rekod Kehadiran',cuti:'Sistem Cuti',prestasi:'Penilaian Prestasi',laporan:'Laporan & Statistik'};
  let currentPage='overview';
  window.App={
    go(page){
      if(page===currentPage&&page!=='overview')return;
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      document.getElementById('page-'+page)?.classList.add('active');
      document.getElementById('nav-'+page)?.classList.add('active');
      document.getElementById('topbar-title').textContent=PAGE_TITLES[page]||page;
      currentPage=page;
    },
    openModal(id){document.getElementById(id)?.classList.add('open');},
    closeModal(id){document.getElementById(id)?.classList.remove('open');},
    switchTab(group,tab,el){
      const parent=document.getElementById('page-'+group); if(!parent)return;
      parent.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      parent.querySelectorAll('.tab-pane').forEach(tp=>tp.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(group+'-'+tab)?.classList.add('active');
    }
  };
  document.addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))e.target.classList.remove('open');});

  function setDate(){
    const now=new Date(), hari=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'], bln=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis'];
    document.getElementById('topbar-date').textContent=`${hari[now.getDay()]}, ${now.getDate()} ${bln[now.getMonth()]} ${now.getFullYear()}`;
    const lu=document.getElementById('last-update'); if(lu)lu.textContent=now.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});
  }

  function initOverview(){
    const bulanLabel=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis'];
    const kehadiranData=[88,90,87,92,91,93,89,94,91,90,88,91];
    renderBarChart('ov-kehadiran-chart',bulanLabel.map((b,i)=>({label:b,value:kehadiranData[i],color:kehadiranData[i]>=90?'var(--success)':kehadiranData[i]>=85?'var(--accent)':'var(--warning)'})),100);
    renderDonut('ov-donut','ov-donut-legend',[{label:'DET',value:14,color:'#0f62fe'},{label:'DEP',value:28,color:'#24a148'},{label:'DTK',value:16,color:'#8a3ffc'},{label:'DEG',value:11,color:'#f1c21b'},{label:'DEQ',value:20,color:'#da1e28'},{label:'Staf Sokongan',value:8,color:'#009d9a'}]);
    renderBarChart('ov-prestasi-chart',BAHAGIAN.map((b,i)=>({label:b,value:sri(i*17+5,78,95),color:'var(--accent)'})),100);
    const activities=[{dot:'var(--accent)',text:'Nordin bin Talib mengemukakan permohonan cuti tahunan 3 hari',time:'10 minit lalu'},{dot:'var(--success)',text:'Cuti Ahmad bin Abdullah telah diluluskan oleh pengarah',time:'32 minit lalu'},{dot:'var(--purple)',text:'Staf baru Siti binti Hassan telah didaftarkan ke sistem',time:'1 jam lalu'},{dot:'var(--teal)',text:'Laporan LNPT April 2025 telah dijana dan disimpan',time:'2 jam lalu'},{dot:'var(--danger)',text:'Mohd bin Yusof belum daftar masuk — status AWOL',time:'3 jam lalu'},{dot:'var(--warning)',text:'15 staf telah mendaftar untuk Kursus AutoCAD Lanjutan',time:'Semalam'}];
    document.getElementById('ov-activity').innerHTML=activities.map(a=>`<div class="activity-item"><div class="activity-dot" style="background:${a.dot}"></div><div><div class="activity-text">${a.text}</div><div class="activity-time">${a.time}</div></div></div>`).join('');
    document.getElementById('kpi-cemerlang').textContent=STAF.filter(s=>s.skor_lnpt>=90).length;
    document.getElementById('kpi-baik').textContent=STAF.filter(s=>s.skor_lnpt>=80&&s.skor_lnpt<90).length;
    document.getElementById('kpi-memuaskan').textContent=STAF.filter(s=>s.skor_lnpt>=70&&s.skor_lnpt<80).length;
    document.getElementById('kpi-lemah').textContent=STAF.filter(s=>s.skor_lnpt<70).length;
  }

  function initNotif(){
    document.getElementById('notif-list').innerHTML=NOTIFIKASI.map(n=>`<div class="notif-item ${n.unread?'unread':''}"><div class="notif-icon-wrap" style="background:${n.bg}">${n.icon}</div><div class="notif-body"><div class="notif-title">${n.title}</div><div class="notif-desc">${n.desc}</div></div><div class="notif-time">${n.time}</div></div>`).join('');
  }

  function init(){
    document.getElementById('app').innerHTML=LAYOUT_HTML;
    setDate(); initOverview(); initNotif();
    StafModule.init(); KehadiranModule.init(); CutiModule.init(); PrestasiModule.init(); LaporanModule.init();
  }

  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>
</body>
</html>
