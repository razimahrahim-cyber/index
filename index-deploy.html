<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Pengurusan JKE PPD</title>
<style>
:root{--bg:#f4f4f4;--surface:#fff;--sidebar-bg:#161616;--sidebar-hover:#262626;--sidebar-active-bg:#0f62fe1a;--sidebar-active-text:#78a9ff;--accent:#0f62fe;--accent2:#0043ce;--text:#161616;--text-muted:#6f6f6f;--border:#e0e0e0;--success:#24a148;--warning:#f1c21b;--danger:#da1e28;--purple:#8a3ffc;--teal:#009d9a;--sidebar-w:260px;--radius:2px;--shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);--shadow-lg:0 4px 16px rgba(0,0,0,.15)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
#app{display:flex;height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:#c6c6c6;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;box-shadow:var(--shadow);z-index:10}
.content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.sidebar-logo{padding:16px;border-bottom:1px solid #3d3d3d;flex-shrink:0}
.logo-emblem{width:36px;height:36px;background:var(--accent);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
.logo-title{font-size:14px;font-weight:600;color:#f4f4f4}
.logo-subtitle{font-size:11px;color:#a8a8a8;line-height:1.4;margin-top:2px}
.logo-badge{display:inline-block;margin-top:8px;background:#24a14822;color:#42be65;border:1px solid #42be6544;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.sidebar-nav{flex:1;padding:8px 0}
.nav-section{margin-bottom:4px}
.nav-section-label{font-size:10px;color:#6f6f6f;text-transform:uppercase;letter-spacing:.1em;padding:12px 16px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;color:#c6c6c6;font-size:13px;border-left:3px solid transparent;transition:background .12s,color .12s;user-select:none}
.nav-item:hover{background:var(--sidebar-hover);color:#f4f4f4}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);border-left-color:var(--sidebar-active-text)}
.nav-item-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item-label{flex:1}
.nav-badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.sidebar-footer{padding:12px 16px;border-top:1px solid #3d3d3d;flex-shrink:0}
.user-card{display:flex;align-items:center;gap:10px}
.user-avatar-sm{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.user-name{font-size:12px;color:#f4f4f4;font-weight:600}
.user-role{font-size:11px;color:#a8a8a8}
.topbar-title{font-size:15px;font-weight:600;flex:1}
.topbar-date{font-size:12px;color:var(--text-muted)}
.btn-topbar{border:1px solid var(--border);background:var(--surface);padding:6px 14px;border-radius:var(--radius);font-size:12px;cursor:pointer;color:var(--text);transition:background .12s}
.btn-topbar:hover{background:var(--bg)}
.btn-topbar.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.page{display:none;animation:fadeIn .2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-header{margin-bottom:24px}
.page-title{font-size:20px;font-weight:600}
.page-subtitle{font-size:13px;color:var(--text-muted);margin-top:3px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--border);padding:20px 20px 16px;border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:default;transition:box-shadow .15s,transform .15s}
.kpi-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-blue::after{background:var(--accent)}.kpi-green::after{background:var(--success)}.kpi-yellow::after{background:var(--warning)}.kpi-red::after{background:var(--danger)}.kpi-purple::after{background:var(--purple)}.kpi-teal::after{background:var(--teal)}
.kpi-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.kpi-value{font-size:34px;font-weight:300;line-height:1.1}
.kpi-sub{font-size:11px;color:var(--text-muted);margin-top:6px}
.kpi-trend{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;margin-top:4px}
.trend-up{color:var(--success)}.trend-down{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600}
.card-body{padding:20px}
.card-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{background:#f4f4f4;padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:hover{background:#f4f4f4}
tbody td{padding:10px 14px;font-size:13px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.b-blue{background:#d0e2ff;color:#0043ce}.b-green{background:#defbe6;color:#0e6027}.b-yellow{background:#fcf4d6;color:#6e4f00}.b-red{background:#fff1f1;color:#a2191f}.b-purple{background:#e8daff;color:#491d8b}.b-gray{background:#e0e0e0;color:#525252}
.btn{padding:8px 16px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;border:none;font-family:inherit;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:var(--danger);color:#fff}.btn-success{background:var(--success);color:#fff}.btn-sm{padding:4px 10px;font-size:11px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:12px;font-weight:600;color:var(--text)}
.form-input,.form-select,.form-textarea{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--surface);font-family:inherit;color:var(--text)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #0f62fe26}
.form-textarea{resize:vertical;min-height:72px}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--surface);font-family:inherit}
.search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #0f62fe26}
.filter-select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--surface);cursor:pointer;font-family:inherit}
.pagination{display:flex;align-items:center;gap:4px}
.page-btn{padding:5px 10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;border-radius:var(--radius);font-size:12px;transition:background .12s}
.page-btn:hover:not(:disabled){background:var(--bg)}
.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:12px;color:var(--text-muted)}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .12s;white-space:nowrap}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none}.tab-pane.active{display:block}
.progress-track{background:#e0e0e0;border-radius:20px;height:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;transition:width .5s ease}
.bar-chart{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{width:130px;font-size:12px;color:var(--text-muted);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:#e0e0e0;border-radius:2px;height:18px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.bar-val{width:44px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:7px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cal-header-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.cal-day-label{text-align:center;font-size:10px;color:var(--text-muted);font-weight:600;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:transform .1s}
.cal-cell:hover{transform:scale(1.1)}
.cal-hadir{background:var(--accent);color:#fff}.cal-cuti{background:var(--warning);color:#161616}.cal-mc{background:var(--danger);color:#fff}.cal-hujung{background:#e0e0e0;color:#a8a8a8}
.cal-legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.cal-leg{display:flex;align-items:center;gap:5px;font-size:11px}
.cal-leg-dot{width:10px;height:10px;border-radius:2px}
.stat-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-box{flex:1;min-width:90px;background:var(--surface);border:1px solid var(--border);padding:14px 12px;border-radius:var(--radius);text-align:center;box-shadow:var(--shadow)}
.stat-val{font-size:26px;font-weight:300;line-height:1.1}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:4px}
.activity-list{display:flex;flex-direction:column;gap:12px}
.activity-item{display:flex;gap:10px;align-items:flex-start}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.activity-text{font-size:12px;line-height:1.4}
.activity-time{font-size:11px;color:var(--text-muted);margin-top:2px}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.av-32{width:32px;height:32px;font-size:12px}.av-64{width:64px;height:64px;font-size:22px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(22,22,22,.6);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;animation:modalIn .18s ease}
.modal-sm{width:440px;max-width:95vw}.modal-md{width:580px;max-width:95vw}.modal-lg{width:720px;max-width:96vw}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);padding:2px 6px;border-radius:var(--radius)}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
.notif-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.notif-item:hover{background:var(--bg)}.notif-item.unread{background:#edf5ff}
.notif-icon-wrap{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.notif-body{flex:1;min-width:0}
.notif-title{font-size:13px;font-weight:600;margin-bottom:2px}
.notif-desc{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif-time{font-size:11px;color:var(--text-muted);white-space:nowrap}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}
.quick-actions{display:flex;gap:10px;flex-wrap:wrap}
.text-muted{color:var(--text-muted)}.text-sm{font-size:12px}.text-xs{font-size:11px}.fw-600{font-weight:600}
.mt-4{margin-top:4px}.mb-0{margin-bottom:0!important}
.flex-center{display:flex;align-items:center;gap:8px}.gap-8{gap:8px}
code.chip{font-size:11px;background:#f4f4f4;border:1px solid #e0e0e0;padding:2px 6px;border-radius:var(--radius);font-family:monospace}
@media(max-width:900px){:root{--sidebar-w:56px}.nav-item-label,.nav-section-label,.logo-subtitle,.logo-badge,.user-name,.user-role,.logo-title{display:none}.sidebar-logo{padding:12px}.nav-item{justify-content:center;padding:12px}.sidebar-footer{display:none}}
@media(max-width:640px){.grid-2,.grid-3,.form-grid{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.content{padding:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* DATA */
const BAHAGIAN=['DET','DEP','DTK','DEG','DEQ','Staf Sokongan'];
const JWM={'DET':['Pengarah','Timbalan Pengarah','Penolong Pengarah','Pegawai Tadbir Kanan','Pegawai Tadbir','Pembantu Tadbir'],'DEP':['Jurutera Elektrik Kanan','Jurutera Elektrik','Jurutera Muda','Juruteknik Elektrik Kanan','Juruteknik Elektrik','Pembantu Teknik'],'DTK':['Pegawai IT Kanan','Pegawai IT','Pembantu IT','Penganalisis Sistem','Jurutera Perisian'],'DEG':['Pegawai Kewangan Kanan','Pegawai Kewangan','Pembantu Kewangan','Penolong Akauntan','Kerani Kewangan'],'DEQ':['Penyelia Operasi','Juruteknik Kanan','Juruteknik','Pembantu Operasi','Penjaga Stor','Pemandu'],'Staf Sokongan':['Pegawai Latihan Kanan','Pegawai Latihan','Fasilitator','Koordinator Latihan','Pembantu Latihan','Pembantu Am']};
const GRM={'DET':['A44','A41','N29','N17'],'DEP':['C52','C48','C44','C41'],'DTK':['F41','F29','F22'],'DEG':['W48','W44','W22','W17'],'DEQ':['J41','J29','R11','H11'],'Staf Sokongan':['S41','S29','E41','N17']};
const ND=['Ahmad','Muhammad','Nor','Siti','Mohd','Nurul','Azman','Faizal','Hairul','Zulkifli','Norazura','Halimah','Roslinda','Syafiqah','Khairul','Norzalina','Ismail','Hazrul','Amirul','Farhana','Rizal','Wan Ahmad','Nik','Aziz','Hafiza','Zalina','Safwan','Hafizuddin','Nurhafiza','Azrul','Rashidah','Muhamad Hafiz','Suzana','Irfan','Nadia','Badrul Hisyam','Rozita','Khairu Anwar','Saidatul','Harith'];
const NB=['bin Abdullah','binti Hassan','bin Ibrahim','binti Ali','bin Yusof','binti Ahmad','bin Ismail','binti Ramli','bin Othman','binti Razak','bin Hamid','binti Jamil','bin Kassim','binti Zakaria','bin Ghani','binti Nordin','bin Talib','binti Sulaiman','bin Ariffin','binti Kamal','bin Idris','binti Mohd Noor','bin Bakar','binti Hashim','bin Rahim','binti Zainudin','bin Salleh','binti Mansor','bin Harun','binti Osman'];
const AVC=['#0f62fe','#24a148','#8a3ffc','#009d9a','#ee5396','#0072c3','#fa4d56','#ff832b'];
const STO=['Aktif','Aktif','Aktif','Aktif','Aktif','Aktif','Aktif','Cuti','Sakit'];
function sr(s){const x=Math.sin(s+1)*10000;return x-Math.floor(x)}
function sri(s,a,b){return Math.floor(sr(s)*(b-a+1))+a}
const STAF=Array.from({length:97},(_,i)=>{
  const bi=sri(i*7+1,0,5),bh=BAHAGIAN[bi],jw=JWM[bh][sri(i*3+2,0,JWM[bh].length-1)],gr=GRM[bh][sri(i*5+3,0,GRM[bh].length-1)];
  const tl=sri(i*23+8,10,24),bl=String(sri(i*29+9,1,12)).padStart(2,'0'),hl=String(sri(i*31+10,1,28)).padStart(2,'0');
  return{id:i+1,noPerkerja:'JKE'+String(i+1001).padStart(4,'0'),nama:ND[i%ND.length]+' '+NB[i%NB.length],jawatan:jw,bahagian:bh,gred:gr,status:STO[sri(i*11+4,0,8)],email:'staf'+(i+1)+'@jkeppd.gov.my',telefon:'01'+sri(i*19+7,1,9)+'-'+String(sri(i*41+11,1000000,9999999)),tarikh_lantikan:`20${tl}-${bl}-${hl}`,skor_lnpt:sri(i*13+5,61,98),kpi:sri(i*17+6,68,100),avatarColor:AVC[i%8],cuti_tahunan_baki:sri(i*37+11,2,20),cuti_tahunan_had:20,cuti_sakit_baki:sri(i*41+12,5,14),kompetensi:['A','B','B+','A-','A+'][sri(i*43+13,0,4)],jantina:sri(i*53+14,0,1)?'Lelaki':'Perempuan',negeri:['Selangor','Kuala Lumpur','Negeri Sembilan','Melaka','Johor'][sri(i*61+15,0,4)]};
});
const JC=['Cuti Tahunan','Cuti Sakit','Cuti Khas','Cuti Tanpa Gaji','Cuti Bersalin'];
const SC=['Urusan peribadi','Rawatan perubatan','Majlis perkahwinan keluarga','Urusan perjalanan luar negara','Urusan anak-anak','Pemulihan selepas pembedahan'];

/* CHARTS */
function rBC(id,items,max){max=max||100;const el=document.getElementById(id);if(!el)return;el.innerHTML=items.map(it=>{const p=Math.round((it.value/max)*100),c=it.color||'var(--accent)';return`<div class="bar-row"><div class="bar-label" title="${it.label}">${it.label}</div><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${c}"></div></div><div class="bar-val" style="color:${c}">${it.value}${it.unit||''}</div></div>`;}).join('');}
function rCC(id,labels,vals,hi){const el=document.getElementById(id);if(!el)return;const mx=Math.max(...vals);el.innerHTML=`<div style="display:flex;align-items:flex-end;gap:6px;height:140px;padding:0 4px">${labels.map((lb,i)=>{const p=(vals[i]/mx)*100,isHl=i===(hi!==undefined?hi:labels.length-1);return`<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:3px"><div style="font-size:10px;font-weight:${isHl?700:400};color:${isHl?'var(--accent)':'var(--text-muted)'}">${vals[i]}%</div><div style="width:100%;background:${isHl?'var(--accent)':'#0f62fe55'};border-radius:2px 2px 0 0;height:${p*1.1}px;min-height:4px"></div><div style="font-size:10px;color:${isHl?'var(--accent)':'var(--text-muted)'};font-weight:${isHl?700:400}">${lb}</div></div>`;}).join('')}</div>`;}
function rDN(svgId,legId,segs){const cx=70,cy=70,R=55,r=32,tot=segs.reduce((s,x)=>s+x.value,0);let ang=-Math.PI/2,paths='';segs.forEach(sg=>{const sw=(sg.value/tot)*Math.PI*2,x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang),x2=cx+R*Math.cos(ang+sw),y2=cy+R*Math.sin(ang+sw),xi1=cx+r*Math.cos(ang+sw),yi1=cy+r*Math.sin(ang+sw),xi2=cx+r*Math.cos(ang),yi2=cy+r*Math.sin(ang),lg=sw>Math.PI?1:0;paths+=`<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${lg},1 ${x2.toFixed(2)},${y2.toFixed(2)} L${xi1.toFixed(2)},${yi1.toFixed(2)} A${r},${r} 0 ${lg},0 ${xi2.toFixed(2)},${yi2.toFixed(2)} Z" fill="${sg.color}" stroke="#fff" stroke-width="2"/>`;ang+=sw;});const sv=document.getElementById(svgId);if(sv)sv.innerHTML=paths+`<text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="16" font-weight="600" fill="#161616">${tot}</text><text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="10" fill="#6f6f6f">Staf</text>`;const le=document.getElementById(legId);if(le)le.innerHTML=segs.map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div><span>${s.label}: <strong>${s.value}</strong></span></div>`).join('');}

const PT={overview:'Overview KPI',staf:'Direktori Staf',kehadiran:'Rekod Kehadiran',cuti:'Sistem Cuti',prestasi:'Penilaian Prestasi',laporan:'Laporan & Statistik'};
let cur='overview';
window.App={
  go(p){if(p===cur&&p!=='overview')return;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p)?.classList.add('active');document.getElementById('nav-'+p)?.classList.add('active');document.getElementById('topbar-title').textContent=PT[p]||p;cur=p;},
  openModal(id){document.getElementById(id)?.classList.add('open');},
  closeModal(id){document.getElementById(id)?.classList.remove('open');},
  switchTab(g,t,el){const pr=document.getElementById('page-'+g);if(!pr)return;pr.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));pr.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById(g+'-'+t)?.classList.add('active');}
};
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))e.target.classList.remove('open');});

function init(){
  document.getElementById('app').innerHTML=HTML;
  const now=new Date(),hr=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'],bl=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis'];
  const td=document.getElementById('topbar-date');if(td)td.textContent=hr[now.getDay()]+', '+now.getDate()+' '+bl[now.getMonth()]+' '+now.getFullYear();
  const lu=document.getElementById('last-update');if(lu)lu.textContent=now.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});
  rBC('ov-kehadiran-chart',['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis'].map((b,i)=>{const v=[88,90,87,92,91,93,89,94,91,90,88,91][i];return{label:b,value:v,color:v>=90?'var(--success)':v>=85?'var(--accent)':'var(--warning)'};}),100);
  rDN('ov-donut','ov-donut-legend',[{label:'DET',value:14,color:'#0f62fe'},{label:'DEP',value:28,color:'#24a148'},{label:'DTK',value:16,color:'#8a3ffc'},{label:'DEG',value:11,color:'#f1c21b'},{label:'DEQ',value:20,color:'#da1e28'},{label:'Staf Sokongan',value:8,color:'#009d9a'}]);
  rBC('ov-prestasi-chart',BAHAGIAN.map((b,i)=>({label:b,value:sri(i*17+5,78,95),color:'var(--accent)'})),100);
  document.getElementById('ov-activity').innerHTML=[{d:'var(--accent)',t:'Nordin bin Talib mengemukakan permohonan cuti 3 hari',tm:'10 minit lalu'},{d:'var(--success)',t:'Cuti Ahmad bin Abdullah telah diluluskan',tm:'32 minit lalu'},{d:'var(--purple)',t:'Staf baru Siti binti Hassan telah didaftarkan',tm:'1 jam lalu'},{d:'var(--teal)',t:'Laporan LNPT April 2025 telah dijana',tm:'2 jam lalu'},{d:'var(--danger)',t:'Mohd bin Yusof belum daftar masuk - AWOL',tm:'3 jam lalu'}].map(a=>`<div class="activity-item"><div class="activity-dot" style="background:${a.d}"></div><div><div class="activity-text">${a.t}</div><div class="activity-time">${a.tm}</div></div></div>`).join('');
  document.getElementById('notif-list').innerHTML=NOTIF.map(n=>`<div class="notif-item ${n.unread?'unread':''}"><div class="notif-icon-wrap" style="background:${n.bg}">${n.icon}</div><div class="notif-body"><div class="notif-title">${n.title}</div><div class="notif-desc">${n.desc}</div></div><div class="notif-time">${n.time}</div></div>`).join('');
  SM.init();KM.init();CM.init();PM.init();LM.init();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>
</body>
</html>
